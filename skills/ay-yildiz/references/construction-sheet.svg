<text x="710.00" y="1382.00" font-size="15" text-anchor="start" font-weight="400" fill="#1a1a1a">Width of the white hem</text>
<text x="1210.00" y="1382.00" font-size="15" text-anchor="start" font-weight="400" fill="#1a1a1a">1/30 G</text>
<text x="1330.00" y="1382.00" font-size="15" text-anchor="start" font-weight="400" fill="#1a1a1a">2000</text>
<text x="40.00" y="1426.00" font-size="13" text-anchor="start" font-weight="700" fill="#888">TR</text>
<text x="70.00" y="1426.00" font-size="14" text-anchor="start" font-weight="400" fill="#333">Uçkurluk, Boy'un içindedir: al zemin x = 0'dan 88000'e, uçkurluk -2000'den 0'a. Ekran çiziminde uçkurluk genelde gösterilmez.</text>
<text x="40.00" y="1451.00" font-size="13" text-anchor="start" font-weight="700" fill="#888">EN</text>
<text x="70.00" y="1451.00" font-size="14" text-anchor="start" font-weight="400" fill="#333">The hem is inside the length: red runs from x = 0 to 88000, the hem from -2000 to 0. Screen drawings usually leave the hem out.</text>
<text x="40.00" y="1476.00" font-size="13" text-anchor="start" font-weight="700" fill="#888">TR</text>
<text x="70.00" y="1476.00" font-size="14" text-anchor="start" font-weight="400" fill="#333">Yasal al: parlaklık 27,5, kırmızılık-yeşillik 44,8, sarılık-mavilik 15,6 (en çok 3 NBS, kumaş için). #DC0D15 yasal renk değil, ekran için bir uzlaşıdır.</text>
