<text x="710.00" y="1344.00" font-size="15" text-anchor="start" font-weight="400" fill="#1a1a1a">Length, including the hem</text>
<text x="1210.00" y="1344.00" font-size="15" text-anchor="start" font-weight="400" fill="#1a1a1a">1 1/2 G</text>
<text x="1330.00" y="1344.00" font-size="15" text-anchor="start" font-weight="400" fill="#1a1a1a">90000</text>
<line x1="40.00" y1="1396.00" x2="1440.00" y2="1396.00" stroke="#ddd" stroke-width="1"/>
