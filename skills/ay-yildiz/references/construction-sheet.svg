<text x="710.00" y="1306.00" font-size="15" text-anchor="start" font-weight="400" fill="#1a1a1a">Diameter of the star's circle</text>
<text x="1210.00" y="1306.00" font-size="15" text-anchor="start" font-weight="400" fill="#1a1a1a">1/4 G</text>
